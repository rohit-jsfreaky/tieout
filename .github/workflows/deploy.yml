name: Build and deploy

# Same shape as Pannly: GitHub's runners build the images (they can reach every
# registry), push them to GHCR, then SSH into the VPS and point Dokku at the new
# image. The VPS never builds anything, which matters here because the API image
# carries Chromium and would be slow and heavy to build on a small box.
#
# Two apps, because Tieout is two services:
#   tieout       the API + the fake company + the browser
#   tieout-desk  the Next.js screen
#
# The dashboard's git deploy works too. The API needs nothing extra — its
# Dockerfile is at the repo root, which is where Dokku looks when it picks a
# builder. The desk needs one setting on the server, because its Dockerfile is
# not at the root:
#     dokku builder-dockerfile:set tieout-desk dockerfile-path desk/Dockerfile
# This workflow is the faster path: the API image carries Chromium, and GitHub's
# runners build it in a fraction of the time the VPS would.
#
# The deploy key is `revlio_vps` — the same one the other apps on that host use.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

env:
  DOKKU_HOST: dokku@45.196.196.214
  # Set this to the desk's own URL once the app has a domain. It is baked into the
  # frontend at build time; a wrong value can still be corrected from the browser,
  # because lib/api.ts reads an override out of localStorage.
  API_BASE: https://tieout.YOUR-DOMAIN

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/rohit-jsfreaky/tieout-api:latest
            ghcr.io/rohit-jsfreaky/tieout-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Without these three, build-push-action@v6 attaches provenance and SBOM
          # manifests, and Dokku's pull path fails with "lease does not exist:
          # not found". Same fix as Pannly. Do not remove them.
          provenance: false
          sbom: false
          platforms: linux/amd64

      - name: Deploy the API
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/dokku_ci
          chmod 600 ~/.ssh/dokku_ci
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/dokku_ci \
            ${{ env.DOKKU_HOST }} \
            git:from-image tieout ghcr.io/rohit-jsfreaky/tieout-api:${{ github.sha }}

  desk:
    runs-on: ubuntu-latest
    needs: api
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the desk
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./desk/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ env.API_BASE }}
          tags: |
            ghcr.io/rohit-jsfreaky/tieout-desk:latest
            ghcr.io/rohit-jsfreaky/tieout-desk:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          platforms: linux/amd64

      - name: Deploy the desk
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/dokku_ci
          chmod 600 ~/.ssh/dokku_ci
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/dokku_ci \
            ${{ env.DOKKU_HOST }} \
            git:from-image tieout-desk ghcr.io/rohit-jsfreaky/tieout-desk:${{ github.sha }}
